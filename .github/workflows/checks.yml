# The gate. Vercel deploys main on push; this is what has to pass first.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Every route at four widths, clean console, no horizontal overflow
        run: |
          npx next start -p 3111 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3111/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:3111/ || { echo "server did not start"; exit 1; }
          npm run check:viewports

      - name: The old URLs still redirect
        run: |
          for path in /playground /colophon; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3111$path")
            dest=$(curl -s -o /dev/null -w '%{redirect_url}' "http://localhost:3111$path")
            echo "$path -> $code $dest"
            [ "$code" = "308" ] && [ "${dest##*/}" = "oncall" ] || exit 1
          done
